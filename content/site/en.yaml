colophon: >-
  This site was built like a product. I started with a spec: who visits, what they should see in 30
  seconds, how I'd measure success. Then I studied 9 portfolio sites, pooled 29 ideas and narrowed them to
  one concept: a shelf in my room holding seven tapes. Code, design and copy moved through a phased workflow
  with Claude; each phase ended in a document, each decision came with a reason. What I dropped counts too:
  no copyrighted posters or album covers, code-generated pixel objects instead of an illustrated room, no
  kilim theme, which risked looking touristy. Then I rethought it: colours that run from daylight to night,
  a work wheel that turns with the page, and a pixel avatar drawn in code from my photo. Every font, photo
  and image is credited below.

