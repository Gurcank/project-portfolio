about:
  # Chips open the case study: [Label](#slug). Margin notes sit after a chip (or at the end); never on ATAMap.
  story: >-
    I'm Gürcan, a final-year Information Systems student at Istanbul Okan University, currently on Erasmus+
    in Łódź. I came to product with a question: which role fits me? To answer it, I mapped the path of seven
    roles [SeeYourNextStep](#seeyournextstep) and landed on Product Manager. Since then I've been turning
    scattered information into tangible products: a map for Erasmus cities [ErasmusMap](#erasmusmap), another
    for Atatürk's journeys [ATAMap](#atamap), a climate documentary [İklim Krizi](#iklim-krizi). I design and
    code because it's the shortest way to understand a product end to end. If I'm not hiking, I'm probably
    watching a film.
  notes:
    - after: seeyournextstep
      text: I was its first user ↑
    - after: erasmusmap
      text: 1,602 cities. Haven't visited them all (yet)
    - after: end
      text: Can't do both at once. I tried.
  credentials: OKAN UNIVERSITY · INFORMATION SYSTEMS · GRADUATING JUNE 2027 · ERASMUS+ ŁÓDŹ, OCT 2026 – FEB 2027
  goalsHeading: Goals
  goals: >-
    From February 2027 I'm looking for a full-time, long-term product internship in Istanbul, and I can
    continue through the summer. I want to learn user conversations, prioritisation and decision-making
    against real outcomes. Longer term: PM of a product people actually use.
