about:
  # Chips open the case study: [Label](#slug). Margin notes sit after a chip (or at the end); never on ATAMap.
  story: >-
    Ben Gürcan. İstanbul Okan Üniversitesi'nde Bilişim Sistemleri ve Teknolojileri son sınıftayım; bu dönem
    Erasmus+ ile Łódź'dayım. Ürün tarafına bir soruyla geldim: hangi rol bana uygun? Cevabı bulmak için yedi
    rolün yolunu çizdim [SeeYourNextStep](#seeyournextstep) ve Product Manager'da karar kıldım. O günden beri
    dağınık bilgiyi dokunulabilir ürünlere çeviriyorum: Erasmus şehirleri için bir harita
    [ErasmusMap](#erasmusmap), Atatürk'ün yolculuğu için bir başkası [ATAMap](#atamap), bir iklim belgeseli
    [İklim Krizi](#iklim-krizi). Tasarlıyor ve kodluyorum, çünkü bir ürünü uçtan uca anlamanın en kısa yolu
    bu. Yürüyüşte değilsem muhtemelen film izliyorumdur.
  notes:
    - after: seeyournextstep
      text: ilk kullanıcısı bendim ↑
    - after: erasmusmap
      text: 1602 şehir; hepsini gezmedim (henüz)
    - after: end
      text: ikisi aynı anda olmuyor, denedim
  credentials: OKAN ÜNİVERSİTESİ · BİLİŞİM SİSTEMLERİ VE TEKNOLOJİLERİ · MEZUNİYET HAZİRAN 2027 · ERASMUS+ ŁÓDŹ, EKİM 2026 – ŞUBAT 2027
  goalsHeading: Hedeflerim
  goals: >-
    Şubat 2027'den itibaren İstanbul'da tam zamanlı, uzun dönem bir Product stajı arıyorum; yaz boyunca
    kesintisiz devam edebilirim. Bir ürün ekibinde kullanıcıyla konuşmayı, önceliklendirmeyi ve karar vermeyi
    gerçek sonuçlarla öğrenmek istiyorum. Uzun vadede hedefim, kullanıcısı olan bir ürünün PM'i olmak.
