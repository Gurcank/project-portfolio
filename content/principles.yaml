# Product principles: "When this happens → I do this", each tied to the tape that taught it.
# Source of truth: docs/CONTENT.md §5. Wording changes need approval.
# v3 (2026-11-28): the user's nine principles, in the user's own order: solving the user's problem,
# security, provability, reliability, legal, making it concrete, making it easy, making it beautiful,
# team harmony. Each is grounded in a decision written in that tape's case study.
- order: 1
  project: seeyournextstep
  condition:
    tr: Bir şey yapmaya başlamadan önce
    en: Before I start building anything
  action:
    tr: kimin hangi sorununu çözdüğünü tek cümleyle yazarım; yazamıyorsam başlamam.
    en: I write down whose problem it solves, in one sentence. If I can't, I don't start.
- order: 2
  project: erasmusmap
  condition:
    tr: Kullanıcının verisi işin içine girdiğinde
    en: When users' data is involved
  action:
    tr: yalnızca gerekeni tutarım; şifre ve fotoğraf saklamamak riski baştan siler.
    en: I keep only what's needed. Not storing passwords or photos removes the risk from the start.
- order: 3
  project: atamap
  condition:
    tr: Güven ürünün kendisi olduğunda
    en: When trust is the product
  action:
    tr: kaynağını gösteremediğimi yayımlamam, kapsam küçülse bile.
    en: I don't ship what I can't source, even if scope shrinks.
- order: 4
  project: novera-mobility
  condition:
    tr: Temel sağlam değilken yeni özellik istendiğinde
    en: When new features are asked for on a shaky base
  action:
    tr: önce temeli onarırım; çatlağın üstüne kat çıkılmaz.
    en: I fix the base first. You don't build on cracks.
- order: 5
  project: nature-sport-handbook
  condition:
    tr: Bir görsel ya da veri kullanacağımda
    en: When I use an image or a dataset
  action:
    tr: lisansını ve kaynağını kayda geçirmeden yayımlamam; çarpıcı ama belirsiz olanı seçmem.
    en: I don't publish it until its licence and source are on record. I pass on striking but unclear ones.
- order: 6
  project: iklim-krizi
  condition:
    tr: Konu soyut ve uzak kaldığında
    en: When a subject stays abstract and distant
  action:
    tr: "onu görülebilir kılarım: rapor yerine belgesel, rakam yerine okurun hayatından bir örnek."
    en: "I make it visible: a documentary instead of a report, an example from the reader's life instead of a number."
- order: 7
  project: idddergi
  condition:
    tr: Bir şeyi kullanmak zahmetli olduğunda
    en: When something takes effort to use
  action:
    tr: "zahmeti ben üstlenirim: indirilecek bir PDF değil, telefonda sayfa sayfa okunan bir dergi."
    en: "I take the effort on myself: not a PDF to download, but a magazine you page through on your phone."
- order: 8
  project: nature-sport-handbook
  condition:
    tr: Bir şey doğru çalıştığında
    en: When something already works
  action:
    tr: orada durmam, güzelleştiririm; özenli görünen bir rehbere insan daha çok güvenir.
    en: I don't stop there; I make it beautiful. People trust a guide that looks cared for.
- order: 9
  project: novera-mobility
  condition:
    tr: Bir ekiple aynı ürünü yaptığımızda
    en: When a team builds one product together
  action:
    tr: tek bir yazılı kaynaktan çalışırız; kararlar sohbette değil, belgede ve PR'da kalır.
    en: We work from one written source. Decisions live in the doc and the PR, not in chat.
